<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positioning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <nav class="navbar">
    <a href="#top" class="logo">Mysite</a>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main class="content">
    <div class="card">
      <span class="badge">3</span>
      <h2>Messages</h2>
      <p>You have new messages waiting in your inbox.</p>
    </div>

    <div class="card">
      <span class="badge">7</span>
      <h2>Notifications</h2>
      <p>Seven new alerts since your last visit.</p>
    </div>

    <p class="filler">Scroll down to see the fixed elements stay in place.</p>
    <div class="spacer"></div>
  </main>

  <a href="#top" class="back-to-top">&uarr; Top</a>

</html>
